<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Investment Advisor</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <form id="multi-step-form">
        <div class="step">
            <h2>Step 1: Personal Information</h2>
            <label for="name">Name:</label>
            <input type="text" id="name" name="name" required>
            <label for="email">Email:</label>
            <input type="email" id="email" name="email" required>
        </div>
        <div class="step">
            <h2>Step 2: Financial Information</h2>
            <label for="income">Income:</label>
            <input type="number" id="income" name="income" required>
            <label for="expenses">Expenses:</label>
            <input type="number" id="expenses" name="expenses" required>
        </div>
        <div class="step">
            <h2>Step 3: Investment Goals</h2>
            <label for="goals">Investment Goals:</label>
            <textarea id="goals" name="goals" required></textarea>
        </div>
        <button type="button" id="prev">Previous</button>
        <button type="button" id="next">Next</button>
        <button type="submit">Submit</button>
    </form>
    <script src="script.js"></script>
</body>
</html>
